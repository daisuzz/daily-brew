<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Brew</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Brew">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a brew card on a white counter; quiet greys, one clear blue for what to do now */
:root {
  --bg: #ffffff;
  --surface: #f7f8f9;
  --ink: #1c1f22;
  --muted: #7d858c;
  --line: #e4e7ea;
  --accent: #0a8fd0;      /* clear sky blue */
  --accent-ink: #ffffff;
  --accent-soft: #e5f4fb;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Chivo Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1214; --surface: #171b1e; --ink: #eef1f3; --muted: #8e979e; --line: #2a3035;
  --accent: #4bb8ea; --accent-ink: #0f1214; --accent-soft: #13303f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1214; --surface: #171b1e; --ink: #eef1f3; --muted: #8e979e; --line: #2a3035;
  --accent: #4bb8ea; --accent-ink: #0f1214; --accent-soft: #13303f; color-scheme: dark }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
html, body { margin: 0; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 500; letter-spacing: .12em; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }

/* settings */
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
.stepper button { width: 40px; height: 42px; border: 0; background: transparent; color: var(--accent); font-size: 20px; cursor: pointer; flex: none; }
.stepper input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); text-align: center; font-family: var(--font-num); font-size: 17px; font-variant-numeric: tabular-nums; padding: 0; height: 42px; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .unit { color: var(--muted); font-size: 13px; padding-right: 4px; }
.readout { display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--font-num); font-size: 17px; font-variant-numeric: tabular-nums; }
.readout small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 9px 2px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg button:disabled, .stepper button:disabled, .stepper input:disabled { cursor: default; opacity: .5; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* dial */
.dial { display: grid; place-items: center; position: relative; }
.dial svg { width: min(260px, 70vw); height: auto; max-width: 100%; display: block; }
.dial .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; padding: 0 22%; }
.clock { font-family: var(--font-num); font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.now { font-size: 13px; font-weight: 700; color: var(--accent); text-wrap: balance; }
.target { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.controls { display: flex; gap: 10px; }
.btn { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 700; letter-spacing: .06em; padding: 12px; border-radius: 4px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* schedule */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps li { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 6px; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps .t { font-family: var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
ol.steps .g { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
ol.steps .g small { color: var(--muted); }
ol.steps li.done { color: var(--muted); }
ol.steps li.active { background: var(--accent-soft); border-radius: 4px; border-top-color: transparent; }
ol.steps li.active .g, ol.steps li.active > span:nth-child(2) { color: var(--accent); font-weight: 700; }
ol.steps li.active + li { border-top-color: transparent; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* recipe picker */
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin: 4px 0 0; }
.recipes { display: flex; flex-direction: column; gap: 8px; }
.recipe { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 6px; padding: 12px 14px; cursor: pointer; }
.recipe:hover { border-color: var(--line); }
.recipe .shop { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.recipe .name { font-weight: 700; font-size: 15px; grid-column: 1; }
.recipe .spec { font-family: var(--font-num); font-size: 12px; color: var(--muted); grid-column: 1; font-variant-numeric: tabular-nums; }
.recipe .go { grid-column: 2; grid-row: 1 / span 3; color: var(--accent); font-size: 18px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }

/* timer view header */
.backbar { display: flex; align-items: center; gap: 10px; }
.back { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14px; padding: 4px 0; cursor: pointer; }
.rtitle { display: flex; flex-direction: column; gap: 2px; }
.rtitle .shop { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.rtitle h2 { font-size: 20px; margin: 0; text-wrap: balance; }
.rtitle .sub { font-size: 12px; color: var(--muted); }
.source { font-size: 12px; color: var(--muted); }
.source a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Daily Brew</h1>
  </header>

  <!-- 1. レシピを選ぶ -->
  <section id="view-pick" style="display:flex;flex-direction:column;gap:14px">
    <div class="seg" id="serve">
      <button data-v="hot" aria-pressed="true">ホット</button>
      <button data-v="iced" aria-pressed="false">アイス</button>
    </div>
    <div class="group">
      <h2>お店・バリスタのレシピ</h2>
      <div class="recipes" id="list-shop"></div>
    </div>
    <div class="group">
      <h2>Daily Brew の定番（1:16）</h2>
      <div class="recipes" id="list-house"></div>
    </div>
  </section>

  <!-- 2. タイマー -->
  <section id="view-brew" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="backbar"><button class="back" id="back">‹ レシピを選ぶ</button></div>
    <div class="rtitle">
      <span class="shop" id="r-shop"></span>
      <h2 id="r-name"></h2>
      <span class="sub" id="r-sub"></span>
    </div>

    <div class="panel">
      <div class="settings">
        <div class="field">
          <label class="label" for="bean-in">豆</label>
          <div class="stepper"><button id="bean-minus" aria-label="豆を減らす">−</button><input id="bean-in" type="number" inputmode="decimal" min="5" max="60" step="0.5" value="20"><span class="unit">g</span><button id="bean-plus" aria-label="豆を増やす">＋</button></div>
        </div>
        <div class="field">
          <span class="label" id="water-label">湯量</span>
          <div class="readout" id="water-out"></div>
        </div>
      </div>
      <p class="hint" id="r-hint"></p>
      <p class="source" id="r-source"></p>
    </div>

    <div class="panel">
      <div class="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="6"></circle>
          <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
            transform="rotate(-90 100 100)" stroke-dasharray="552.9" stroke-dashoffset="552.9"></circle>
          <g id="ticks"></g>
        </svg>
        <div class="center">
          <div class="now" id="now">準備OK</div>
          <div class="clock" id="clock">0:00</div>
          <div class="target" id="target"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" id="start">スタート</button>
        <button class="btn" id="reset">リセット</button>
      </div>
      <ol class="steps" id="steps"></ol>
    </div>

  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---- recipes ----
  // 各レシピは基準の豆量（bean）で書き、豆量を変えると湯・氷・各投の量を比例させる。
  // steps: t=開始秒, to=その時点までの累計湯量（注がない手順は省略）, label=やること
  // official:false のアイスは、公式のホットを元にした急冷アレンジ（湯6割＋氷4割）。
  const ICE_SHARE = 0.4;
  const RECIPES = [
    {
      id: "philo-46", group: "shop", shop: "PHILOCOFFEA", name: "4:6メソッド", dripper: "HARIO V60",
      hot: { bean: 20, water: 300, temp: "浅煎り93℃ / 中煎り88℃ / 深煎り83℃", grind: "中粗〜粗挽き", end: 210,
        steps: [{ t: 0, to: 60, label: "1投目（蒸らし）" }, { t: 45, to: 120, label: "2投目" }, { t: 90, to: 180, label: "3投目" }, { t: 130, to: 240, label: "4投目" }, { t: 160, to: 300, label: "5投目" }],
        tip: "前の湯がほぼ落ちきってから次を注ぎます。3:30に落ちきるよう挽き目を調整してください。",
        source: ["PHILOCOFFEA 公式", "https://philocoffea.com/pages/how-to-brew"] },
      iced: { bean: 20, water: 150, ice: 80, temp: "90℃", grind: "中粗〜粗挽き", end: 180,
        steps: [{ t: 0, to: 30, label: "1投目（蒸らし）" }, { t: 40, to: 60, label: "2投目" }, { t: 70, to: 90, label: "3投目" }, { t: 100, to: 120, label: "4投目" }, { t: 130, to: 150, label: "5投目" }],
        tip: "蒸らしは粉全体を均一に濡らします（スプーンで混ぜてもOK）。",
        source: ["BARISTAI 掲載の PHILOCOFFEA レシピ", "https://baristai.net/recipes/shops/2"] }
    },
    {
      id: "philo-hybrid", group: "shop", shop: "PHILOCOFFEA", name: "ハイブリッドメソッド", dripper: "HARIO Switch",
      hot: { bean: 20, water: 280, temp: "93℃ → 2投目のあと70℃", grind: "中粗〜粗挽き", end: 180,
        steps: [{ t: 0, to: 60, label: "スイッチを開けて1投目" }, { t: 30, to: 120, label: "2投目。注ぎ終えたらポットの湯に水を足して70℃に" }, { t: 75, to: 280, label: "スイッチを閉じて残りを注ぐ" }, { t: 105, label: "スイッチを開ける" }],
        tip: "前半は高温の透過で香りと酸味、後半は低温の浸漬で甘さを引き出すレシピです。",
        source: ["BARISTAI 掲載の PHILOCOFFEA レシピ", "https://baristai.net/recipes/shops/9"] },
      iced: { bean: 20, water: 140, ice: 80, temp: "93℃ → 2投目のあと70℃", grind: "中粗〜粗挽き", end: 210,
        steps: [{ t: 0, to: 30, label: "スイッチを開けて1投目" }, { t: 30, to: 70, label: "2投目。注ぎ終えたらポットの湯に水を足して70℃に" }, { t: 100, to: 140, label: "スイッチを閉じて残りを注ぐ" }, { t: 130, label: "スイッチを開ける" }],
        tip: "サーバーに氷を入れ、その上に直接落とします。",
        source: ["BARISTAI 掲載の PHILOCOFFEA レシピ", "https://baristai.net/recipes/shops/18"] }
    },
    {
      id: "lightup", group: "shop", shop: "LIGHT UP COFFEE", name: "ドリップ", dripper: "HARIO V60",
      hot: { bean: 15, water: 240, temp: "90℃", grind: "2:30〜3:00で落ちきる細かさ", end: 165,
        steps: [{ t: 0, to: 45, label: "蒸らし（30秒待つ）" }, { t: 30, to: 100, label: "2投目" }, { t: 60, to: 160, label: "3投目" }, { t: 80, to: 200, label: "4投目" }, { t: 100, to: 240, label: "5投目" }],
        tip: "残りの湯は1分以上かけて円を描くように注ぎ、最後にドリッパーを軽く揺すって粉を平らにします。",
        source: ["LIGHT UP COFFEE 公式", "https://lightupcoffee.com/en/blogs/brew-guide/drip"] },
      iced: { bean: 21, water: 150, ice: 100, iceGuess: true, temp: "92℃", grind: "ホットより細かめ", end: 135,
        steps: [{ t: 0, to: 45, label: "蒸らし（スプーンで5回混ぜると甘さが出る）" }, { t: 30, to: 90, label: "2投目" }, { t: 60, to: 120, label: "3投目" }, { t: 90, to: 150, label: "4投目" }],
        tip: "落ちきったら氷とよく混ぜます。氷の量は公式に記載がないので目安です。",
        source: ["LIGHT UP COFFEE 公式", "https://lightupcoffee.com/en/blogs/brew-guide/iced-coffee"] }
    },
    {
      id: "glitch", group: "shop", shop: "GLITCH COFFEE & ROASTERS", name: "ハンドドリップ", dripper: "ドリッパー指定なし",
      hot: { bean: 16.5, water: 250, temp: "86.5℃", grind: "中挽き", end: 150, approx: true,
        steps: [{ t: 0, to: 50, label: "蒸らし（10秒かけて均一に）" }, { t: 30, label: "スプーンで底から混ぜる" }, { t: 50, to: 120, label: "2投目" }, { t: 80, to: 250, label: "落ち着いたらゆっくり250gまで" }],
        tip: "抽出液が約210gたまったらドリッパーを外します。3投目以降の時間は記事に記載がないので目安です。",
        source: ["BE-PAL の GLITCH COFFEE 紹介記事", "https://www.bepal.net/archives/257885"] }
    },
    {
      id: "hoffmann", group: "shop", shop: "James Hoffmann", name: "Ultimate V60", dripper: "HARIO V60",
      hot: { bean: 15, water: 250, temp: "沸騰直後（熱いほど良い）", grind: "中細挽き", end: 210,
        steps: [{ t: 0, to: 30, label: "蒸らし（ドリッパーを回して全体をなじませる）" }, { t: 45, to: 150, label: "30秒かけて60%まで" }, { t: 75, to: 250, label: "30秒かけて100%まで、少しやさしく" }, { t: 105, label: "スプーンで右に1回・左に1回混ぜ、軽く回す" }],
        tip: "元のレシピは豆30g・湯500gです。半量にしています（豆の量を変えると比例して計算します）。",
        source: ["HARIO USA 掲載レシピ", "https://www.hario-usa.com/blogs/recipes-and-more-from-friends/james-hoffmann-uitimate-v60-technique"] }
    },
    {
      id: "house-46", group: "house", shop: "Daily Brew", name: "透過式 4:6（1:16）", dripper: "V60など円錐ドリッパー",
      hot: { bean: 20, water: 320, temp: "88〜93℃", grind: "中粗挽き", end: 225,
        steps: [{ t: 0, to: 64, label: "1投目（蒸らし）" }, { t: 45, to: 128, label: "2投目" }, { t: 90, to: 192, label: "3投目" }, { t: 135, to: 256, label: "4投目" }, { t: 180, to: 320, label: "5投目" }],
        tip: "4:6メソッドを1:16に合わせた版です。スケールが「累計」の数字になるまで注いでください。" }
    },
    {
      id: "house-immersion", group: "house", shop: "Daily Brew", name: "浸漬式（4分）", dripper: "クレバー / フレンチプレス / Switch",
      hot: { bean: 20, water: 320, temp: "92〜96℃", grind: "中粗挽き", end: 300,
        steps: [{ t: 0, to: 320, label: "全量を注ぐ" }, { t: 30, label: "軽く3回ほど混ぜ、ふたをする" }, { t: 240, label: "落とす（クレバーを置く／プレスを押す）" }],
        tip: "全量を一度に注いで浸すので、ムラが少なく味が安定します。" }
    },
    {
      id: "house-hybrid", group: "house", shop: "Daily Brew", name: "ハイブリッド（1:16）", dripper: "HARIO Switch / クレバー",
      hot: { bean: 20, water: 320, temp: "90〜93℃", grind: "中挽き", end: 210,
        steps: [{ t: 0, to: 64, label: "バルブ開・蒸らし" }, { t: 40, to: 128, label: "2投目（透過）" }, { t: 75, to: 320, label: "バルブを閉じて残りを注ぐ（浸漬）" }, { t: 150, label: "バルブを開けて落とす" }],
        tip: "前半は透過で香りを、後半は浸漬で甘さと厚みを出します。" }
    },
  ];
  const ARRANGE_NOTE = "このお店のアイスレシピは公開されていないため、ホットのレシピを急冷式にアレンジしています（湯を6割にして、残り4割を氷に）。";

  // 公式アイスがなければ、ホットを急冷式に変換する
  function variant(r, serve) {
    if (serve === "hot") return { ...r.hot, official: r.group === "shop" };
    if (r.iced) return { ...r.iced, official: true };
    const h = r.hot, k = 1 - ICE_SHARE;
    return {
      ...h, official: false, water: Math.round(h.water * k), ice: Math.round(h.water * ICE_SHARE),
      grind: h.grind + "（アイスは1〜2段細かめ）",
      steps: h.steps.map(s => s.to == null ? s : { ...s, to: Math.round(s.to * k) }),
      tip: h.tip, source: h.source,
    };
  }

  const st = { serve: "hot", recipeId: null, bean: 20, running: false, startAt: 0, elapsed: 0, lastStep: -1 };
  let raf = 0, audio = null, wakeLock = null;
  const recipe = () => RECIPES.find(r => r.id === st.recipeId) || RECIPES[0];
  const cur = () => variant(recipe(), st.serve);
  const factor = () => st.bean / cur().bean;
  const scale = (g) => Math.round(g * factor());
  const iced = () => st.serve === "iced";
  const hotWater = () => scale(cur().water);
  const iceG = () => cur().ice ? scale(cur().ice) : 0;
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function schedule() {
    const v = cur();
    const steps = v.steps.map(s => ({ ...s, cum: s.to == null ? null : scale(s.to) }));
    let prev = 0;
    steps.forEach(s => { if (s.cum != null) { s.amount = s.cum - prev; prev = s.cum; } });
    steps.push({ t: v.end, label: iced() ? "落ちきったら氷とよく混ぜる" : "落ちきったら完成" });
    return { steps, end: v.end };
  }

  // ---- picker ----
  function specText(r) {
    const v = variant(r, st.serve);
    const water = v.ice ? `湯${v.water}g＋氷${v.ice}g` : `湯${v.water}g`;
    return `豆${v.bean}g ・ ${water} ・ 約${fmt(v.end)}`;
  }
  function renderPicker() {
    document.querySelectorAll("#serve button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.serve));
    for (const g of ["shop", "house"]) {
      $("list-" + g).innerHTML = RECIPES.filter(r => r.group === g).map(r => {
        const v = variant(r, st.serve);
        const badge = iced() && !v.official && g === "shop" ? `<span class="badge">急冷アレンジ</span>` : "";
        return `<button class="recipe" data-id="${r.id}">
          ${g === "shop" ? `<span class="shop">${esc(r.shop)}</span>` : ""}
          <span class="name">${esc(r.name)}${badge}</span>
          <span class="spec">${esc(r.dripper)} ・ ${specText(r)}</span>
          <span class="go" aria-hidden="true">›</span>
        </button>`;
      }).join("");
    }
  }
  $("serve").onclick = (e) => { const v = e.target.dataset?.v; if (v) { st.serve = v; renderPicker(); } };
  document.querySelector("#view-pick").addEventListener("click", (e) => {
    const b = e.target.closest(".recipe"); if (!b) return;
    openRecipe(b.dataset.id, st.serve);
  });

  function openRecipe(id, serve) {
    reset();
    st.recipeId = id; st.serve = serve;
    st.bean = cur().bean;
    showView("brew"); window.scrollTo(0, 0);
    renderRecipe(); renderSettings(); renderTimer();
  }
  function renderRecipe() {
    const r = recipe(), v = cur();
    $("r-shop").textContent = r.group === "shop" ? r.shop : "Daily Brew の定番";
    $("r-name").textContent = `${r.name}（${iced() ? "アイス" : "ホット"}）`;
    $("r-sub").textContent = `${r.dripper} ・ 湯温 ${v.temp} ・ ${v.grind}`;
    const notes = [];
    if (!v.official && iced() && r.group === "shop") notes.push(ARRANGE_NOTE);
    if (!v.official && iced() && r.group === "house") notes.push(`サーバーに氷を入れ、その上に直接落とします。湯を6割にしたぶん、挽き目は1〜2段細かめに。`);
    notes.push(v.tip);
    $("r-hint").textContent = notes.join(" ");
    $("r-source").innerHTML = v.source ? `出典：<a href="${v.source[1]}" target="_blank" rel="noopener">${esc(v.source[0])}</a>` : "";
  }
  $("back").onclick = () => { reset(); showView("pick"); renderPicker(); };

  // ---- timer ----
  function renderSettings() {
    if (document.activeElement !== $("bean-in")) $("bean-in").value = st.bean;
    $("water-label").textContent = iced() ? "湯と氷" : "湯量";
    $("water-out").innerHTML = iced() ? `湯 ${hotWater()}g<small>＋氷 ${iceG()}g</small>` : `${hotWater()} g<small>1:${(hotWater() / st.bean).toFixed(1).replace(/\.0$/, "")}</small>`;
    const locked = st.running || st.elapsed > 0;
    document.querySelectorAll(".settings button, .settings input").forEach(b => b.disabled = locked);
  }

  function renderTimer() {
    if (!st.recipeId) return;
    const { steps, end } = schedule();
    const t = st.elapsed;
    let idx = -1;
    steps.forEach((s, i) => { if (t >= s.t) idx = i; });
    const finished = t >= end;
    $("clock").textContent = fmt(t);
    const C = 552.9;
    $("ring").setAttribute("stroke-dashoffset", String(C * (1 - Math.min(1, t / end))));
    $("ticks").innerHTML = steps.filter(s => s.t < end).map(s => {
      const a = (s.t / end) * 2 * Math.PI - Math.PI / 2;
      const x = 100 + 88 * Math.cos(a), y = 100 + 88 * Math.sin(a);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"></circle>`;
    }).join("");

    const started = st.running || t > 0;
    if (finished) { $("now").textContent = "できあがり"; $("target").textContent = iced() ? "氷を入れたグラスに注いでどうぞ" : "どうぞ召し上がれ"; }
    else if (!started || idx < 0) { $("now").textContent = iced() ? `サーバーに氷 ${iceG()}g` : "準備OK"; $("target").textContent = `${steps[0].label}${steps[0].cum ? ` 累計 ${steps[0].cum}g` : ""}`; }
    else {
      const c = steps[idx], next = steps[idx + 1];
      $("now").textContent = c.label;
      const parts = [];
      if (c.cum) parts.push(`累計 ${c.cum}g`);
      if (next) parts.push(`次まで ${fmt(next.t - t)}`);
      $("target").textContent = parts.join(" ・ ");
    }
    $("steps").innerHTML = steps.map((s, i) => {
      const cls = finished ? (i === steps.length - 1 ? "active" : "done") : i < idx ? "done" : i === idx && started ? "active" : "";
      const g = s.cum ? `${s.cum}g${s.amount && s.amount !== s.cum ? ` <small>(+${s.amount})</small>` : ""}` : "";
      return `<li class="${cls}"><span class="t">${fmt(s.t)}</span><span>${esc(s.label)}</span><span class="g">${g}</span></li>`;
    }).join("");

    if (st.running && idx !== st.lastStep) { beep(idx === 0 ? 1 : 2); st.lastStep = idx; }
    if (st.running && finished) { beep(3); stop(); }
    $("start").textContent = st.running ? "一時停止" : t > 0 && !finished ? "再開" : "スタート";
    $("start").disabled = finished;
  }

  function tick() { st.elapsed = (performance.now() - st.startAt) / 1000; renderTimer(); if (st.running) raf = requestAnimationFrame(tick); }
  async function start() {
    commitBean();
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); } catch (e) { audio = null; }
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { wakeLock = null; }
    st.running = true; st.startAt = performance.now() - st.elapsed * 1000;
    renderSettings(); tick();
  }
  function stop() { st.running = false; cancelAnimationFrame(raf); try { wakeLock?.release(); } catch (e) {} wakeLock = null; renderSettings(); renderTimer(); }
  function reset() { stop(); st.elapsed = 0; st.lastStep = -1; renderSettings(); renderTimer(); }
  function beep(n) {
    if (!audio) return;
    for (let i = 0; i < n; i++) {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.22;
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.18);
    }
  }

  const clampBean = (v) => Math.min(60, Math.max(5, Math.round(v * 2) / 2));
  function commitBean() {
    const v = parseFloat($("bean-in").value);
    st.bean = Number.isFinite(v) ? clampBean(v) : st.bean;
    $("bean-in").value = st.bean;
    renderSettings(); renderTimer();
  }
  $("bean-in").addEventListener("input", () => {
    const v = parseFloat($("bean-in").value);
    if (Number.isFinite(v) && v >= 5 && v <= 60) { st.bean = v; renderSettings(); renderTimer(); }
  });
  $("bean-in").addEventListener("change", commitBean);
  $("bean-in").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bean-in").blur(); });
  $("bean-minus").onclick = () => { st.bean = clampBean(st.bean - 1); renderSettings(); renderTimer(); };
  $("bean-plus").onclick = () => { st.bean = clampBean(st.bean + 1); renderSettings(); renderTimer(); };
  $("start").onclick = () => st.running ? stop() : start();
  $("reset").onclick = reset;
  document.addEventListener("visibilitychange", async () => { if (st.running && document.visibilityState === "visible") { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} } });

  // ---- views ----
  function showView(name) {
    $("view-pick").hidden = name !== "pick";
    $("view-brew").hidden = name !== "brew";
  }

  // ---- boot ----
  renderPicker();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
